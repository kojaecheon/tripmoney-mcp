name: 고객 플랫폼 검증

on:
  pull_request:
    branches: [main]
    paths:
      - 'customer-platform/**'
      - '.github/workflows/customer-platform.yml'

permissions:
  contents: read

jobs:
  customer-platform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: customer-platform
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: customer-platform/.nvmrc
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: node --import tsx --test --test-concurrency=4 --test-reporter=spec tests/unit/*.test.ts
      - run: npm run test:http
